<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 790" width="800" height="790" role="img" aria-label="Proposed Team A castle interior in a 183.6-stud wall ring; Team B is mirrored">
  <defs>
    <style>
      .title{font:700 20px Arial,sans-serif;fill:#26343c}.sub{font:12px Arial,sans-serif;fill:#35434a}.label{font:700 14px Arial,sans-serif;fill:#f6f2e8}.detail{font:11px Arial,sans-serif;fill:#233139}.tiny{font:10px Arial,sans-serif;fill:#233139}.wall{fill:#c5c1b7;stroke:#59616a;stroke-width:12}.door{stroke:#d49d50;stroke-width:9;stroke-linecap:round}.ladder{fill:#a26838;stroke:#5e3c24;stroke-width:2}.callout{fill:none;stroke:#55483d;stroke-width:1.5;stroke-dasharray:5 4}
    </style>
  </defs>
  <rect width="800" height="790" fill="#e7e1d2"/>
  <text x="30" y="31" class="title">Castle interior — Team A proposal</text>
  <text x="30" y="50" class="sub">Team B mirrors across the field’s center · local f points toward the gate →</text>
  <text x="590" y="75" class="sub">PROPOSED · for review</text>
  <g transform="translate(400 390) scale(3)">
    <rect x="-100" y="-100" width="200" height="200" fill="#a5bd80" stroke="#7e9968" stroke-width="1" stroke-dasharray="3 2"/>
    <rect class="wall" x="-91.8" y="-91.8" width="183.6" height="183.6"/>
    <rect x="-87.8" y="-87.8" width="175.6" height="175.6" fill="#adbf86"/>
    <rect x="-32" y="-9" width="123.8" height="18" fill="#d0b58b" fill-opacity=".8" stroke="#a88b66" stroke-width=".5" stroke-dasharray="3 2"/>

    <rect x="-76" y="-22" width="44" height="44" fill="#777e84" stroke="#454c53" stroke-width="1.3"/>
    <rect x="-76" y="42" width="28" height="26" fill="#936f45" stroke="#57452f" stroke-width="1.2"/>
    <rect x="-70" y="-75" width="42" height="27" fill="#6b8191" stroke="#3e5361" stroke-width="1.2"/>
    <rect x="-8" y="43" width="43" height="32" fill="#946d5e" stroke="#5e433d" stroke-width="1.2"/>
    <rect x="43" y="46" width="16" height="18" fill="#b08b5e" stroke="#694e31" stroke-width="1" stroke-dasharray="2 1"/>

    <line class="door" x1="-32" y1="-6" x2="-32" y2="6"/>
    <line class="door" x1="-48" y1="51" x2="-48" y2="59"/>
    <line class="door" x1="-54" y1="-48" x2="-44" y2="-48"/>
    <line class="door" x1="0" y1="43" x2="10" y2="43"/>
    <line class="door" x1="35" y1="52" x2="35" y2="66"/>
    <rect x="88" y="-10.2" width="8" height="20.4" fill="#adbf86"/>
    <line class="door" x1="91.8" y1="-10" x2="91.8" y2="10"/>

    <g fill="#eef2df" stroke="#294a5b" stroke-width=".6">
      <circle cx="-60" cy="-66" r="1.6"/><circle cx="-50" cy="-66" r="1.6"/><circle cx="-40" cy="-66" r="1.6"/>
      <circle cx="-60" cy="-57" r="1.6"/><circle cx="-50" cy="-57" r="1.6"/><circle cx="-40" cy="-57" r="1.6"/>
    </g>

    <g class="ladder">
      <rect x="-84" y="-82" width="4" height="5"/><rect x="-84" y="77" width="4" height="5"/>
      <rect x="78" y="-82" width="4" height="5"/><rect x="78" y="77" width="4" height="5"/>
      <rect x="77" y="-25" width="4" height="5"/>
    </g>
    <g fill="#69727c" stroke="#3e4852" stroke-width="1">
      <circle cx="-89.8" cy="-89.8" r="5"/><circle cx="-89.8" cy="89.8" r="5"/>
      <circle cx="89.8" cy="-89.8" r="5"/><circle cx="89.8" cy="89.8" r="5"/>
    </g>
    <circle cx="20" cy="-55" r="5" fill="#cc8d49" stroke="#654b2f" stroke-width="1.5"/>
    <path d="M20 -55 v35 h25" fill="none" stroke="#cc8d49" stroke-width="2" stroke-dasharray="3 2"/>
    <circle cx="91.8" cy="0" r="5" fill="#844f2e" stroke="#483425" stroke-width="1"/>
  </g>
  <g text-anchor="middle">
    <text class="label" x="238" y="388">KEEP</text>
    <text class="label" x="214" y="558">STOCKPILE</text>
    <text class="label" x="253" y="210">BARRACKS</text>
    <text class="label" x="440" y="564">WORKSHOP</text>
    <text class="detail" x="553" y="568">RAM PAD</text>
    <text class="detail" x="460" y="212">TUNNEL EXIT</text>
    <text class="detail" x="475" y="383">18-stud clear courtyard</text>
    <text class="detail" x="717" y="390">GATE</text>
  </g>
  <path class="callout" d="M675 390 H737 V333"/>
  <text x="601" y="318" class="detail">One ballista on gatehouse roof</text>
  <text x="30" y="725" class="sub">Each square is proportional to its proposed footprint. Orange ticks mark doors; small pale dots mark six preview spawn positions.</text>
  <text x="30" y="744" class="sub">The tunnel exit is ~76 studs from the Keep door and ~129 from the stockpile door. Roof access and combat rules remain open.</text>
  <text x="30" y="770" class="sub">Ground plane: f → toward enemy; north is up. Wall ring 183.6 × 183.6 studs; castle pad 200 × 200 studs.</text>
</svg>
