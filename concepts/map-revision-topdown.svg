<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 820" width="1100" height="820" role="img" aria-label="Proposed mirrored siege map with larger castles, central road, gathering pads, craters, barricades, and L-shaped tunnels">
  <defs>
    <pattern id="grass" width="30" height="30" patternUnits="userSpaceOnUse"><rect width="30" height="30" fill="#91b664"/><path d="M2 28l3-5m15-11l2-4m5 22l2-3" stroke="#81a651" stroke-width="1"/></pattern>
    <style>
      .title{font:700 20px Arial,sans-serif;fill:#26343c}.subtitle{font:13px Arial,sans-serif;fill:#35434a}.team{font:700 24px Arial,sans-serif;fill:#f7f3e8}.small{font:700 11px Arial,sans-serif;fill:#253c34}.micro{font:10px Arial,sans-serif;fill:#243b34}.legend{font:12px Arial,sans-serif;fill:#27363f}.node{fill:#f3e9a9;fill-opacity:.52;stroke:#736945;stroke-width:1.5}.wall{fill:#adb1ad;stroke:#4d5563;stroke-width:7}.pad{fill:#9fbd75;stroke:#6b8b51;stroke-width:2;stroke-dasharray:6 4}.tunnel{fill:none;stroke:#7b4828;stroke-width:8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:13 8}.cover{fill:#376e4c;fill-opacity:.55;stroke:#2d5b3d;stroke-width:1}.crater{fill:#9a7458;stroke:#66564d;stroke-width:3}.barricade{fill:#704824;stroke:#4b311d;stroke-width:1}
    </style>
  </defs>
  <rect width="1100" height="820" fill="#8caaba"/>
  <text x="32" y="26" class="title">Medieval Siege — proposed map proportions</text>
  <text x="770" y="26" class="subtitle">FOR REVIEW · coordinates not yet approved</text>
  <rect x="30" y="40" width="1040" height="680" rx="40" fill="url(#grass)" stroke="#647b67" stroke-width="5"/>
  <g transform="translate(550 380)">
    <rect x="-520" y="-340" width="60" height="680" fill="#557e5b" fill-opacity=".12"/>
    <rect x="460" y="-340" width="60" height="680" fill="#557e5b" fill-opacity=".12"/>
    <rect x="-520" y="-340" width="1040" height="60" fill="#557e5b" fill-opacity=".12"/>
    <rect x="-520" y="280" width="1040" height="60" fill="#557e5b" fill-opacity=".12"/>

    <rect x="-188.2" y="-15" width="376.4" height="30" fill="#b79467" stroke="#906e4c" stroke-width="1.5"/>
    <path d="M-188.2 0 H188.2" fill="none" stroke="#d3b788" stroke-width="3" stroke-dasharray="20 14"/>

    <g aria-label="resource gathering pads">
      <circle class="node" cx="-420" cy="-190" r="58"/><circle class="node" cx="420" cy="-190" r="58"/>
      <circle class="node" cx="-420" cy="195" r="66.5"/><circle class="node" cx="420" cy="195" r="66.5"/>
      <circle class="node" cx="-250" cy="-190" r="58"/><circle class="node" cx="250" cy="-190" r="58"/>
      <circle class="node" cx="-260" cy="185" r="66.5"/><circle class="node" cx="260" cy="185" r="66.5"/>
      <circle class="node" cx="-125" cy="125" r="50.5"/><circle class="node" cx="125" cy="125" r="50.5"/>
      <circle class="node" cx="-120" cy="-235" r="50.5"/><circle class="node" cx="120" cy="-235" r="50.5"/>
      <circle class="node" cx="-115" cy="245" r="58"/><circle class="node" cx="115" cy="245" r="58"/>
      <circle class="node" cx="0" cy="-110" r="44"/><circle class="node" cx="0" cy="110" r="44"/>
    </g>

    <g aria-label="castle pads and rings">
      <rect class="pad" x="-380" y="-100" width="200" height="200"/><rect class="pad" x="180" y="-100" width="200" height="200"/>
      <rect class="wall" x="-371.8" y="-91.8" width="183.6" height="183.6"/><rect class="wall" x="188.2" y="-91.8" width="183.6" height="183.6"/>
      <rect x="-194" y="-12" width="12" height="24" fill="#8f6843"/><rect x="182" y="-12" width="12" height="24" fill="#8f6843"/>
      <rect x="-370" y="-78" width="180" height="156" fill="#b8413a" fill-opacity=".09"/>
      <rect x="190" y="-78" width="180" height="156" fill="#3a5fb8" fill-opacity=".09"/>
      <text class="team" x="-280" y="8" text-anchor="middle">RED</text>
      <text class="team" x="280" y="8" text-anchor="middle">BLUE</text>
    </g>

    <g aria-label="cover zones and L-shaped tunnels">
      <rect class="cover" x="-177" y="-68" width="45" height="28"/><rect class="cover" x="-177" y="40" width="45" height="28"/>
      <rect class="cover" x="132" y="-68" width="45" height="28"/><rect class="cover" x="132" y="40" width="45" height="28"/>
      <rect class="cover" x="-105" y="-138" width="40" height="36"/><rect class="cover" x="65" y="-138" width="40" height="36"/>
      <path class="tunnel" d="M-85 -120 H-260 V-55"/><path class="tunnel" d="M85 -120 H260 V-55"/>
      <circle cx="-85" cy="-120" r="6" fill="#d68941"/><circle cx="85" cy="-120" r="6" fill="#d68941"/>
      <circle cx="-260" cy="-55" r="6" fill="#d68941"/><circle cx="260" cy="-55" r="6" fill="#d68941"/>
    </g>

    <g aria-label="crouch cover">
      <circle class="crater" cx="-105" cy="-65" r="18"/><circle class="crater" cx="105" cy="-65" r="18"/>
      <circle class="crater" cx="-55" cy="48" r="18"/><circle class="crater" cx="55" cy="48" r="18"/>
      <circle cx="-105" cy="-65" r="9" fill="#765d4c"/><circle cx="105" cy="-65" r="9" fill="#765d4c"/>
      <circle cx="-55" cy="48" r="9" fill="#765d4c"/><circle cx="55" cy="48" r="9" fill="#765d4c"/>
      <rect class="barricade" x="-131" y="-39" width="12" height="4"/><rect class="barricade" x="119" y="-39" width="12" height="4"/>
      <rect class="barricade" x="-131" y="35" width="12" height="4"/><rect class="barricade" x="119" y="35" width="12" height="4"/>
    </g>

    <g aria-label="resource pad labels" class="small" text-anchor="middle" dominant-baseline="middle">
      <text x="-420" y="-190">A1</text><text x="420" y="-190">B1</text>
      <text x="-420" y="195">A2</text><text x="420" y="195">B2</text>
      <text x="-250" y="-190">A3</text><text x="250" y="-190">B3</text>
      <text x="-260" y="185">A4</text><text x="260" y="185">B4</text>
      <text x="-125" y="125">A5</text><text x="125" y="125">B5</text>
      <text x="-120" y="-235">A6</text><text x="120" y="-235">B6</text>
      <text x="-115" y="245">A7</text><text x="115" y="245">B7</text>
      <text x="0" y="-110">C1</text><text x="0" y="110">C2</text>
    </g>
    <text x="0" y="-23" text-anchor="middle" class="small">30-stud central road</text>
    <text x="0" y="-294" text-anchor="middle" class="micro">NORTH · tunnel entrances in cover north of the road</text>
  </g>
  <g class="legend">
    <circle cx="50" cy="760" r="10" fill="#f3e9a9" stroke="#736945"/><text x="67" y="764">resource pad</text>
    <line x1="183" y1="760" x2="220" y2="760" stroke="#7b4828" stroke-width="7" stroke-dasharray="10 6"/><text x="230" y="764">L tunnel</text>
    <circle cx="333" cy="760" r="10" fill="#9a7458" stroke="#66564d" stroke-width="2"/><text x="350" y="764">crouch crater</text>
    <rect x="475" y="756" width="22" height="8" fill="#704824"/><text x="507" y="764">barricade</text>
    <rect x="610" y="752" width="25" height="16" fill="#376e4c" fill-opacity=".65"/><text x="645" y="764">cover zone</text>
    <text x="810" y="764">Map: 1,040 × 680 studs</text>
  </g>
  <text x="30" y="798" class="subtitle">Schematic only. Keep, stockpile, barracks, workshop, and ballista locations need a separate interior revision.</text>
</svg>
