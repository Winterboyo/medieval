<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="820" viewBox="0 0 1000 820" role="img" aria-label="Top-down proposed village layout for one mirrored castle">
  <rect width="1000" height="820" fill="#f3efe4"/>
  <text x="72" y="48" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#26333a">Castle interior v2 — village layout proposal</text>
  <text x="72" y="77" font-family="Arial, sans-serif" font-size="15" fill="#506066">Local f points toward the enemy gate → · north is up · Team B mirrors Team A across world x = 0</text>
  <text x="72" y="103" font-family="Arial, sans-serif" font-size="13" fill="#8b5039">PROPOSED — await approval before writing the interior into layout.json or building new castle art</text>

  <!-- Existing 183.6-stud ring, inner face at +/-87.8. -->
  <rect x="100" y="120" width="600" height="600" fill="#758086" stroke="#455158" stroke-width="2"/>
  <rect x="113.1" y="133.1" width="573.8" height="573.8" fill="#b7ca98"/>
  <rect x="93" y="113" width="614" height="614" fill="none" stroke="#8f9d86" stroke-width="3" stroke-dasharray="9 8"/>

  <!-- Reserved circulation. -->
  <rect x="295.4" y="390.6" width="392" height="58.8" fill="#d9c492" opacity="0.9"/>
  <rect x="445.8" y="240.3" width="39.2" height="150.3" fill="#d9c492" opacity="0.8"/>
  <rect x="586.3" y="449.4" width="81.7" height="114.4" fill="#d9c492" opacity="0.7"/>
  <path d="M 310 362 L 340 362 M 320 478 L 341 478" stroke="#b59967" stroke-width="18" opacity="0.65"/>

  <!-- Keep with its stockpile room and clear entrance hall. -->
  <rect x="151.6" y="348.1" width="143.8" height="143.8" rx="4" fill="#89929a" stroke="#48525b" stroke-width="4"/>
  <rect x="164.7" y="400.4" width="130.7" height="39.2" fill="#b4bec3" stroke="#54636a" stroke-width="2"/>
  <rect x="164.7" y="439.6" width="58.8" height="39.2" fill="#947654" stroke="#624a31" stroke-width="3"/>
  <circle cx="194.1" cy="459.2" r="4" fill="#edb469" stroke="#744920" stroke-width="1"/>

  <!-- Barracks and four separate specialist buildings. -->
  <rect x="171.2" y="174.9" width="137.3" height="88.2" rx="4" fill="#67869a" stroke="#3d5c6e" stroke-width="4"/>
  <rect x="341.2" y="171.6" width="78.4" height="85" rx="4" fill="#8b7da0" stroke="#574b6c" stroke-width="4"/>
  <rect x="534" y="171.6" width="81.7" height="85" rx="4" fill="#a68563" stroke="#725837" stroke-width="4"/>
  <rect x="360.8" y="573.6" width="91.5" height="91.5" rx="4" fill="#a26a56" stroke="#6d4437" stroke-width="4"/>
  <rect x="501.3" y="570.3" width="78.4" height="91.5" rx="4" fill="#987959" stroke="#654a32" stroke-width="4"/>

  <!-- Tunnel landing, assembly pad, and gatehouse. -->
  <rect x="445.8" y="220.6" width="39.2" height="39.2" fill="none" stroke="#aa6b38" stroke-width="3" stroke-dasharray="6 4"/>
  <circle cx="465.4" cy="240.3" r="9" fill="#ab6c3d" stroke="#724723" stroke-width="3"/>
  <rect x="586.3" y="563.8" width="65.3" height="65.3" fill="#c9a573" stroke="#7b5b36" stroke-width="3" stroke-dasharray="8 5"/>
  <rect x="682" y="387" width="18" height="66" rx="3" fill="#6b747b" stroke="#37434a" stroke-width="3"/>
  <rect x="690" y="396" width="18" height="48" rx="7" fill="#c48745" stroke="#764d24" stroke-width="3"/>
  <rect x="700" y="399" width="39" height="42" fill="#c8ad80" opacity="0.75"/>

  <!-- Corner towers, access ladders, and ballista marker. -->
  <g fill="#64717c" stroke="#3a4853" stroke-width="3">
    <circle cx="106.5" cy="126.5" r="16"/><circle cx="693.5" cy="126.5" r="16"/>
    <circle cx="106.5" cy="713.5" r="16"/><circle cx="693.5" cy="713.5" r="16"/>
  </g>
  <g fill="#b07e4d"><rect x="130" y="150" width="17" height="17"/><rect x="653" y="150" width="17" height="17"/><rect x="130" y="673" width="17" height="17"/><rect x="653" y="673" width="17" height="17"/></g>
  <path d="M 700 410 L 706 426 L 693 420 L 707 414 L 700 430 Z" fill="#be4e3d" stroke="#77382d" stroke-width="2"/>

  <!-- Door markers. -->
  <g fill="#d99a4a" stroke="#8b582b" stroke-width="1">
    <rect x="292" y="402" width="8" height="36" rx="4"/>
    <rect x="181" y="436" width="26" height="8" rx="4"/>
    <rect x="226" y="260" width="28" height="8" rx="4"/>
    <rect x="365" y="253" width="28" height="8" rx="4"/>
    <rect x="560" y="253" width="28" height="8" rx="4"/>
    <rect x="394" y="569" width="28" height="8" rx="4"/>
    <rect x="527" y="566" width="28" height="8" rx="4"/>
    <rect x="575" y="603" width="8" height="24" rx="4"/>
  </g>

  <!-- Spawn markers. -->
  <g fill="#dceef2" stroke="#31546a" stroke-width="1.5"><circle cx="204" cy="220" r="4"/><circle cx="237" cy="220" r="4"/><circle cx="270" cy="220" r="4"/><circle cx="204" cy="245" r="4"/><circle cx="237" cy="245" r="4"/><circle cx="270" cy="245" r="4"/></g>

  <!-- Footprint labels. -->
  <g font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#ffffff">
    <text x="223" y="383">KEEP</text><text x="194" y="451" font-size="9">STOCKPILE</text>
    <text x="240" y="198">BARRACKS</text><text x="380" y="210" font-size="13">ALCHEMIST</text>
    <text x="575" y="210" font-size="14">FLETCHER</text><text x="407" y="621" font-size="14">FORGE</text>
    <text x="540" y="615" font-size="14">CARPENTER</text>
  </g>
  <text x="618" y="593" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#4c3826">RAM</text>
  <text x="618" y="608" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#4c3826">PAD</text>
  <text x="467" y="281" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#654424">TUNNEL EXIT</text>
  <text x="496" y="420" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#655538">18-stud clear main route</text>

  <!-- Explanation panel. -->
  <text x="760" y="151" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#26333a">Spatial checks</text>
  <g font-family="Arial, sans-serif" font-size="15" fill="#36454b">
    <text x="760" y="184">Ring: 183.6 × 183.6 studs</text>
    <text x="760" y="210">All ground markers: y = 10</text>
    <text x="760" y="252">Gate → Keep: clear corridor</text>
    <text x="760" y="278">Tunnel → objectives: open fight</text>
    <text x="760" y="304">Four separate specialists</text>
    <text x="760" y="346">Tunnel to Keep door: 76 studs</text>
    <text x="760" y="372" font-size="14">Tunnel to stockpile room: 107 studs</text>
    <text x="760" y="398">Tunnel to barracks: 69 studs</text>
    <text x="760" y="440">Ram pad → turning area → gate</text>
    <text x="760" y="482">Gatehouse ballista above gate</text>
    <text x="760" y="508">Four corner tower ladders</text>
  </g>
  <line x1="760" y1="533" x2="947" y2="533" stroke="#aab4a5" stroke-width="2"/>
  <text x="760" y="565" font-family="Arial, sans-serif" font-size="14" fill="#6d533d">Orange: doors and interactions</text>
  <text x="760" y="590" font-family="Arial, sans-serif" font-size="14" fill="#6d533d">Tan: reserved clear movement</text>
  <text x="760" y="615" font-family="Arial, sans-serif" font-size="14" fill="#6d533d">Dashed: tunnel and ram pads</text>
  <text x="760" y="652" font-family="Arial, sans-serif" font-size="13" fill="#657174">Footprints are measured; vertical art</text>
  <text x="760" y="673" font-family="Arial, sans-serif" font-size="13" fill="#657174">and collision require Studio review.</text>

  <text x="72" y="766" font-family="Arial, sans-serif" font-size="14" fill="#4f5e61">Team A center (-280, 0): world x = -280 + f. Team B center (280, 0): world x = 280 − f. Same z.</text>
  <text x="72" y="792" font-family="Arial, sans-serif" font-size="12" fill="#8b5039">Exact footprints and doors: CASTLE-INTERIOR-V2-PROPOSAL.md · no new art from this proposal until approved.</text>
</svg>
